# fail2ban filter for Rails SecurityFilter middleware
#
# This filter catches malicious requests blocked by the SecurityFilter middleware.
# It matches both BLOCKED (individual requests) and BANNED (IP bans) log entries.
#
# Log format examples from SecurityFilter:
# [SecurityFilter] BLOCKED ip=1.2.3.4 {"timestamp":"2026-02-21T08:39:12+10:00",...}
# [SecurityFilter] BANNED ip=1.2.3.4 duration=86400s reason="instant ban - high-confidence malicious"
#

[Definition]

# Match BLOCKED or BANNED entries with ip= field
# The <HOST> placeholder is replaced by fail2ban with the IP regex
failregex = \[SecurityFilter\] (?:BLOCKED|BANNED) ip=<HOST>

# Ignore legitimate health check endpoints if any
ignoreregex =

# Date detection - ISO8601 timestamps in the JSON payload
# fail2ban will use the system log timestamp by default, which is usually sufficient
datepattern = %%Y-%%m-%%dT%%H:%%M:%%S

[Init]
# Maximum number of entries to search for date
maxlines = 1
