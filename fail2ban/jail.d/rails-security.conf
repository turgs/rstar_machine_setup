# fail2ban jail configuration for Rails SecurityFilter
#
# This jail catches malicious requests blocked by the Rails SecurityFilter
# middleware and bans IPs at the firewall level.
#
# Note: The SecurityFilter middleware already does in-memory banning,
# but fail2ban provides:
# - Persistent bans across app restarts
# - Firewall-level blocking (more efficient)
# - Integration with other services
# - Ban management CLI (fail2ban-client)
#

[rails-security]
enabled = true
port = http,https
filter = rails-security
action = %(action_)s

# Path to Rails production log
# For Kamal deployments with volume mount: /var/log/receptionstar/
logpath = /var/log/receptionstar/production.log

# Ban settings
# Note: Lower thresholds here since SecurityFilter already rate-limits
# This catches persistent attackers who return after app-level ban expires
maxretry = 3
findtime = 3600
bantime = 86400

# Aggressive mode for repeat offenders (inherits from DEFAULT)
